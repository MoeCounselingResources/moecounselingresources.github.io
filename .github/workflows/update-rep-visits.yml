name: Update college rep visits

on:
  schedule:
    - cron: "0 11 * * 1"   # every Monday, about 7 AM Eastern
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild rep-visits.js from the Outlook calendar
        env:
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python3 scripts/update-rep-visits.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/data/rep-visits.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/rep-visits.js
            git commit -m "Update college rep visits from calendar"
            git push
          fi
